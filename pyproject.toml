[project]
name = "koreasim"
version = "0.1.0"
description = "Demographically-grounded Korean society simulator. 7M synthetic Koreans × BitNet 1.58-bit. Runs on your laptop."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "KoreaSim Contributors"}]
keywords = ["llm", "agent-simulation", "korea", "sovereign-ai", "bitnet", "nemotron"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.1",
    "trafilatura>=1.12",
]

[project.optional-dependencies]
data = ["datasets>=2.18", "pyarrow>=15.0"]
viz = ["plotly>=5.20", "pandas>=2.0", "kaleido"]
all = ["datasets>=2.18", "pyarrow>=15.0", "plotly>=5.20", "pandas>=2.0", "kaleido"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-httpx>=0.30", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/winhun98/koreasim"
Repository = "https://github.com/winhun98/koreasim"
Issues = "https://github.com/winhun98/koreasim/issues"

[project.scripts]
koreasim = "koreasim.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["koreasim*"]

[tool.setuptools.package-data]
koreasim = ["viz/data/*.jsonl", "viz/data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # Korean strings + HTML templates legitimately go long.
